version: '3.8'

services:
  sciconnect-cms:
    build:
      context: .
      dockerfile: Dockerfile
    image: sciconnect-cms:latest
    container_name: sciconnect-cms
    restart: unless-stopped
    ports:
      # Bind CMS to port 4000 strictly on localhost for proxying/security
      - '127.0.0.1:4000:3000'
    env_file:
      - .env.production
    networks:
      - foodrestro-network
    volumes:
      # Persist uploaded media files
      - media_data:/app/media

networks:
  foodrestro-network:
    external: true

volumes:
  media_data:
